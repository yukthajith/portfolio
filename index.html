<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Layout diagnostic</title>
<style>
  :root{
    --sat: env(safe-area-inset-top);
    --sar: env(safe-area-inset-right);
    --sab: env(safe-area-inset-bottom);
    --sal: env(safe-area-inset-left);
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:#0d0c0a;color:#e9e2d2;font:13px/1.5 ui-monospace,Consolas,monospace}
  #wrap{padding:calc(14px + env(safe-area-inset-top)) calc(14px + env(safe-area-inset-right)) calc(14px + env(safe-area-inset-bottom)) calc(14px + env(safe-area-inset-left))}
  h1{font-size:15px;margin:0 0 8px;color:#e7bd55}
  .note{color:#9a917d;font-size:12px;margin-bottom:10px}
  .row{display:flex;justify-content:space-between;gap:12px;padding:3px 0;border-bottom:1px dashed #2a2620}
  .k{color:#9a917d}.v{color:#fff;text-align:right;word-break:break-word}
  .ok{color:#7ddc7d}.bad{color:#ff7b6b}
  .sep{margin:10px 0 4px;color:#e7bd55;font-weight:700}
  #viz{position:relative;height:42vh;margin:12px 0;border:1px solid #333;background:#131210;overflow:hidden}
  #viz .lbl{position:absolute;font-size:10px;color:#e7bd55;padding:1px 3px;z-index:5}
  #viz .rect{position:absolute;border:1px solid #e7bd55;background:rgba(231,189,85,.05)}
  #rectVis{position:absolute;border:1px dashed #7ddc7d}
  .safe{position:absolute;background:rgba(255,90,90,.30)}
  button{margin:10px 8px 0 0;padding:10px 16px;border:1px solid #555;background:#1b1915;color:#e9e2d2;font:inherit;border-radius:6px}
  #out{white-space:pre-wrap;margin-top:10px;font-size:11px;color:#b7b0a0}
</style>
</head>
<body>
<div id="wrap">
  <h1>PORTFOLIO LAYOUT DIAGNOSTIC</h1>
  <div class="note">Open this on the phone, tap “Copy report”, paste it back.</div>
  <div id="rows"></div>
  <div id="viz">
    <div class="rect" id="rectView"></div>
    <div id="rectVis"></div>
    <div class="safe" id="safeT"></div>
    <div class="safe" id="safeB"></div>
    <div class="safe" id="safeL"></div>
    <div class="safe" id="safeR"></div>
    <div class="v" id="lblView" style="position:absolute;left:4px;top:4px;color:#e7bd55"></div>
    <div class="v" id="lblVis" style="position:absolute;left:4px;bottom:4px;color:#7ddc7d"></div>
  </div>
  <button id="copy">Copy report</button>
  <pre id="out"></pre>
</div>
<script>
function collect(){
  var root=document.documentElement;
  var cs=getComputedStyle(root);
  var vv=window.visualViewport||{};
  var e={
    innerWidth:window.innerWidth,
    innerHeight:window.innerHeight,
    clientWidth:root.clientWidth,
    clientHeight:root.clientHeight,
    dpr:window.devicePixelRatio,
    screenW:screen.width, screenH:screen.height,
    availW:screen.availWidth, availH:screen.availHeight,
    orientation:(screen.orientation&&screen.orientation.type)||'',
    vvWidth:(vv.width||0), vvHeight:(vv.height||0), vvScale:vv.scale,
    vvOffsetTop:vv.offsetTop, vvOffsetLeft:vv.offsetLeft,
    safeTop:getComputedStyle(document.documentElement).getPropertyValue('--sat').trim(),
    safeRight:getComputedStyle(document.documentElement).getPropertyValue('--sar').trim(),
    safeBottom:getComputedStyle(document.documentElement).getPropertyValue('--sab').trim(),
    safeLeft:cs.getPropertyValue('--sal').trim(),
    mqCoarse:matchMedia('(pointer:coarse)').matches,
    mqHoverNone:matchMedia('(hover:none)').matches,
    mqMax860:matchMedia('(max-width:860px)').matches,
    mqMin768:matchMedia('(min-width:768px)').matches,
    mqLandscape:matchMedia('(orientation:landscape)').matches,
    supportsSvh:CSS.supports('height','100svh'),
    supportsDvh:CSS.supports('height','100dvh')
  };
  e.mobileLayout = e.mqCoarse || e.mqHoverNone || e.mqMax860;
  e.wouldUse = e.mobileLayout ? 'mobile' : 'desktop';
  e.expectedS = (e.clientWidth/1536).toFixed(4);
  e.hOverflow = document.documentElement.scrollWidth > document.documentElement.clientWidth;
  return e;
}
function go(){
  var e = collect();
  window.__diag = e;
  var rows = [
    ['innerWidth x innerHeight', e.innerWidth+' x '+e.innerHeight],
    ['root.clientWidth x clientHeight', e.clientWidth+' x '+e.clientHeight],
    ['devicePixelRatio', e.dpr],
    ['screen w x h', e.screenW+' x '+e.screenH],
    ['screen avail w x h', e.availW+' x '+e.availH],
    ['orientation', e.orientation],
    ['visualViewport w x h', e.vvWidth.toFixed(1)+' x '+e.vvHeight.toFixed(1)],
    ['visualViewport scale', e.vvScale],
    ['vv offsetTop / offsetLeft', e.vvOffsetTop+' / '+e.vvOffsetLeft],
    ['safe-area T / R / B / L', [e.safeTop,e.safeRight,e.safeBottom,e.safeLeft].join(' / ')]
  ];
  var sig = [
    ['mq pointer:coarse', String(e.mqCoarse), e.mqCoarse],
    ['mq hover:none', String(e.mqHoverNone), e.mqHoverNone],
    ['mq max-width:860px', String(e.mqMax860), e.mqMax860],
    ['mq min-width:768px', String(e.mqMin768), true],
    ['supports 100svh / 100dvh', e.supportsSvh+' / '+e.supportsDvh, true],
    ['index.html would use', e.wouldUse, e.wouldUse==='mobile'],
    ['--s = clientWidth/1536', e.expectedS, true],
    ['document horizontal overflow', String(e.hOverflow), !e.hOverflow]
  ];
  var html='';
  rows.forEach(function(r){ html+='<div class="row"><span class="k">'+r[0]+'</span><span class="v">'+r[1]+'</span></div>'; });
  html+='<div class="row" style="border:0;margin-top:8px"><span class="k" style="color:#e7bd55">— classification —</span><span class="v"></span></div>';
  sig.forEach(function(r){ html+='<div class="row"><span class="k">'+r[0]+'</span><span class="v '+(r[2]?'ok':'bad')+'">'+r[1]+'</span></div>'; });
  document.getElementById('rows').innerHTML = html;

  var viz = document.getElementById('viz');
  var vw = e.clientWidth || e.innerWidth;
  var vh = e.clientHeight || e.innerHeight;
  var k = Math.min(viz.clientWidth/vw, viz.clientHeight/vh);
  var ox = (viz.clientWidth - vw*k)/2;
  var oy = (viz.clientHeight - vh*k)/2;
  function box(id,x,y,w,h){
    var n=document.getElementById(id);
    n.style.position='absolute';
    n.style.left=(ox+x*k)+'px';
    n.style.top=(oy+y*k)+'px';
    n.style.width=(w*k)+'px';
    n.style.height=(h*k)+'px';
  }
  box('rectView',0,0,vw,vh);
  var vhH = e.vvHeight || vh;
  box('rectVis',0,(e.vvOffsetTop||0),vw,vhH);
  var t=parseFloat(e.safeTop)||0, r=parseFloat(e.safeRight)||0, b=parseFloat(e.safeBottom)||0, l=parseFloat(e.safeLeft)||0;
  box('safeT',0,0,vw,t);
  box('safeB',0,vh-b,vw,b);
  box('safeL',0,0,l,vh);
  box('safeR',vw-r,0,r,vh);
  [['safeT',t],['safeB',b],['safeL',l],['safeR',r]].forEach(function(p){
    document.getElementById(p[0]).style.display = p[1]>0 ? 'block':'none';
  });
  document.getElementById('lblView').textContent = 'layout '+vw+'×'+vh;
  document.getElementById('lblVis').textContent = 'visible h '+Math.round(vhH);
}
function report(){
  var e = window.__diag || collect();
  var lines = [];
  Object.keys(e).forEach(function(k){ lines.push(k+': '+e[k]); });
  lines.push('viewportMeta: '+(document.querySelector('meta[name=viewport]')||{}).content);
  lines.push('userAgent: '+navigator.userAgent);
  lines.push('url: '+location.href);
  return lines.join('\n');
}
document.getElementById('copy').addEventListener('click', function(){
  var txt = report();
  var btn = this;
  function done(){ btn.textContent='Copied'; setTimeout(function(){ btn.textContent='Copy report'; },1200); }
  if (navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(txt).then(done, function(){ document.getElementById('out').textContent=txt; });
  } else {
    document.getElementById('out').textContent = txt;
  }
});
window.addEventListener('resize', go);
window.addEventListener('orientationchange', function(){ setTimeout(go,150); });
go();
setTimeout(go, 400);
</script>
</body>
</html>
